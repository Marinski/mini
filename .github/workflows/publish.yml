name: Publish

# Push a version tag (npm version patch && git push --follow-tags) and this publishes that
# version to npm and creates the matching GitHub release with the package tarball attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Tag matches package.json
        run: |
          v="v$(node -p 'require("./package.json").version')"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $v"; exit 1; }

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Trusted publishing needs npm 11.5.1+; older npm publishes unauthenticated and gets a 404.
      - run: npm install -g npm@latest
      - run: npm pack
      - run: npm publish ./*.tgz --provenance --access public

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md)"
          [ -n "$notes" ] || notes="See CHANGELOG.md."
          notes="$notes

          \`\`\`bash
          npm i -g @marinski/mini@${GITHUB_REF_NAME#v}
          \`\`\`"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.tgz --clobber
            gh release edit "$GITHUB_REF_NAME" --notes "$notes" --prerelease=false --latest
          else
            gh release create "$GITHUB_REF_NAME" ./*.tgz --title "mini $GITHUB_REF_NAME" --notes "$notes"
          fi
